# ==========================================
# 🚀 系统运行模式配置 (Model Linkage Type)
 
# true=启动时预热所有模型连接，false=跳过（适合快速调试）
system.warmup.enabled=false
# ──────────────────────────────────────────────────────────────
# system.run.type options:
#
#   qwen    - Full cloud (Alibaba DashScope)
#             rewriter  : qwen-turbo
#             finalLlm  : qwen-plus
#             rerank    : qwen-turbo (LLM-based)
#             embed     : text-embedding-v3 (cloud)
#
#   hybrid-openai  - Cloud LLM + Local models (recommended for production)
#             rewriter  : gpt-4o-mini
#             finalLlm  : gpt-4o
#             rerank    : bge-reranker-v2-m3 (local CrossEncoder)
#             embed     : text2vec-base-chinese-paraphrase-pt (local)
#
#   hybrid-qwen - Cloud LLM + Local models (recommended for production)
#             rewriter  : qwen-turbo
#             finalLlm  : qwen-plus
#             rerank    : bge-reranker-v2-m3 (local CrossEncoder)
#             embed     : text2vec-base-chinese-paraphrase-pt (local)
#   openai  - Full cloud (OpenAI)
#             rewriter  : gpt-4o-mini
#             finalLlm  : gpt-4o
#             rerank    : gpt-4o-mini (LLM-based)
#             embed     : text-embedding-3-small (cloud, 1536-dim)
#
#   simple  - No LLM (debug / slot-filling only)
#             rewriter  : skipped (all input treated as QUERY)
#             finalLlm  : skipped
#             rerank    : skipped
#             embed     : skipped
# ──────────────────────────────────────────────────────────────
system.run.type=qwen



# ==========================================
# 🎛️ RAG 检索链路模式配置
# ==========================================
# 支持的模式: 
#   - retrieveRerank : 粗排 + 精排 (默认标准模式)
#   - retrieveOnly   : 仅粗排 (跳过 Rerank，极速响应)
#   - fullText       : 全量知识库模式 (无检索，直接喂全量文本)
#	--simple        : 简单的模式不走意图分类，全部是query,无意图分类，发送全文本给 LLM
rag.query.mode=retrieveOnly

 
# ==========================================
# 🎛️ RAG 核心路由与拦截阈值配置
# ==========================================

# 1. 最终拒答防线：若精排后的最优距离 > 此值，直接拦截并回复“未找到”
rag.threshold.similarity=0.82

# 2. 信任快道：若粗排距离 < 此值，视为完美匹配，跳过本地精排以极速响应
rag.threshold.trust=0.25

# 3. 误杀抢救(粗排资格线)：粗排距离必须 < 此值，才有资格触发抢救
rag.threshold.comp_embed=0.45

# 4. 误杀抢救(精排触发线)：满足粗排资格且精排分数极差(> 此值)，触发强制拉回
rag.threshold.comp_rerank=0.8

# 触发补偿机制后，强行赋予的及格距离分数 (需小于最终拒答防线)
rag.threshold.rescue_score=0.60
 
# 允许进入精排池的最大距离 (距离 > 此值直接淘汰，不送去精排)
rag.threshold.rerank_trigger_max=0.5

 

# ==========================================
# ⚙️ 并发、数量与超时控制
# ==========================================

# 本地精排候选池：从粗排最多取 N 条进入本地打分
rag.limit.max_rerank=5

# 云端上下文限制：最终只取前 N 条发往云端大模型
rag.limit.final_limit=3

# 精排熔断时长(秒)：异步精排最多等待的时间
rag.timeout.rerank=5

